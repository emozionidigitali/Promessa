<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Nostra Promessa | Giovanni & Eliana</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-sage: #5A7363;
            --light-sage: #8EA395;
            --soft-bg: #F4F7F5;
            --text-dark: #2C3E35;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--soft-bg);
            color: var(--text-dark);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SCHERMATA INTRODUTTIVA & VIDEO --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .intro-skip-btn {
            position: absolute;
            bottom: 40px;
            z-index: 10000;
            background: rgba(90, 115, 99, 0.85);
            color: var(--white);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 14px 32px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .intro-skip-btn:hover {
            background: var(--primary-sage);
            transform: scale(1.05);
        }

        /* --- CONTENUTO PRINCIPALE DELL'INVITO --- */
        .main-content {
            opacity: 0;
            transition: opacity 1s ease;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .main-content.visible {
            opacity: 1;
        }

        h1, h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-sage);
        }

        .header-section {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(90, 115, 99, 0.08);
            margin-bottom: 30px;
            border: 1px solid rgba(142, 163, 149, 0.2);
        }

        .header-section h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .date-badge {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--light-sage);
            margin: 15px 0;
            font-weight: 600;
        }

        .info-box {
            margin: 25px 0;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .info-box p {
            margin: 10px 0;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary-sage);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(90, 115, 99, 0.2);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--light-sage);
            transform: translateY(-2px);
        }

        .secondary-video-container {
            margin: 30px 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .secondary-video-container video {
            width: 100%;
            display: block;
        }

        .rsvp-section {
            background: var(--white);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(90, 115, 99, 0.08);
            margin-top: 30px;
            border: 1px solid rgba(142, 163, 149, 0.2);
        }

        .rsvp-section h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-sage);
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        .rsvp-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }

        .btn-whatsapp.decline {
            background-color: #e0e0e0;
            color: #555;
            box-shadow: none;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
        }

        .quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--light-sage);
            margin-top: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- ELEMENTO AUDIO -->
    <audio id="bg-music" preload="auto" loop>
        <source src="canzone.mp3.mp3" type="audio/mp3">
    </audio>

    <!-- SCHERMATA INTRODUTTIVA -->
    <div id="intro-overlay">
        <div class="video-container">
            <video id="intro-video" playsinline muted autoplay>
                <source src="video in.mp4" type="video/mp4">
            </video>
        </div>
        <button class="intro-skip-btn" id="start-btn">Tocca per vivere l'emozione ✨</button>
    </div>

    <!-- CONTENUTO PRINCIPALE -->
    <div class="main-content" id="main-content">
        <div class="header-section">
            <p style="letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem; color: var(--light-sage);">La Nostra Promessa</p>
            <h2>Giovanni & Eliana</h2>
            <div class="date-badge">— 26 Gennaio 2027 —</div>
            
            <div class="info-box">
                <p>🕒 <strong>Orario:</strong> ore 20:30</p>
                <p>📍 <strong>Ristorante:</strong> Al Convento<br>
                <span style="font-size: 0.95rem; color: #666;">Via Cupa Camaldoli 14, 80131 Napoli</span></p>
            </div>

            <div class="action-buttons">
                <a href="https://maps.google.com/?q=Via+Cupa+Camaldoli+14+Napoli" target="_blank" class="btn">Apri Mappa 🗺️</a>
                <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Promessa+di+Matrimonio+-+Giovanni+%26+Eliana&dates=20270126T193000Z/20270126T233000Z&details=Vi+aspettiamo+per+la+nostra+promessa+di+matrimonio!&location=Al+Convento,+Via+Cupa+Camaldoli+14,+80131+Napoli" target="_blank" class="btn">Salva in Calendario 📅</a>
            </div>
        </div>

        <div class="secondary-video-container">
            <video autoplay loop muted playsinline src="video 3.mp4"></video>
        </div>

        <div class="rsvp-section">
            <h3>Conferma la tua presenza</h3>
            <div class="rsvp-buttons">
                <a href="https://wa.me/393511481691?text=Ciao!%20Confermo%20con%20gioia%20la%20mia%20presenza%20alla%20vostra%20promessa!%20❤️" target="_blank" class="btn-whatsapp">Sì, ci sarò! ✨</a>
                <a href="https://wa.me/393511481691?text=Ciao,%20purtroppo%20non%20potrò%20essere%20presente%20alla%20vostra%20promessa,%20vi%20auguro%20il%20meglio!%20🤍" target="_blank" class="btn-whatsapp decline">Purtroppo no</a>
            </div>
        </div>

        <div class="quote">
            "Il nostro per sempre comincia con voi..."
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const introOverlay = document.getElementById('intro-overlay');
            const introVideo = document.getElementById('intro-video');
            const startBtn = document.getElementById('start-btn');
            const mainContent = document.getElementById('main-content');
            const bgMusic = document.getElementById('bg-music');

            function triggerExperience() {
                introOverlay.classList.add('fade-out');
                mainContent.classList.add('visible');

                bgMusic.play().catch(e => {
                    console.log("Audio riprodotto dopo interazione utente.");
                });

                setTimeout(() => {
                    introVideo.pause();
                }, 1000);
            }

            startBtn.addEventListener('click', triggerExperience);
            introVideo.addEventListener('ended', triggerExperience);
        });
    </script>
</body>
</html>
