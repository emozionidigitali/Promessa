<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promessa di Matrimonio - Giovanni & Eliana</title>
    <!-- Importazione di font Google Fonts eleganti e calligrafici -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Sfondo blu notte profondo ed elegante, tipico dei promessi sposi */
            background: linear-gradient(135deg, #070d1a, #101c30, #0a101f);
            background-size: 200% 200%;
            animation: bgMove 12s ease infinite;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenitore dei fuochi d'artificio */
        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: none;
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 0 0 #f7e2b3;
            animation: explode 1.2s infinite ease-out;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 0 0 #f7e2b3, 0 0 0 0 #e6c584, 0 0 0 0 #ffdf79;
            }
            100% {
                transform: scale(30);
                opacity: 0;
                box-shadow: -30px -30px 0 2px #f7e2b3, 30px -30px 0 2px #e6c584, -30px 30px 0 2px #ffdf79, 30px 30px 0 2px #fff;
            }
        }

        /* Schermata iniziale per sbloccare l'audio */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 13, 26, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .start-box h2 {
            font-family: 'Great Vibes', cursive;
            color: #e6c584;
            font-size: 45px;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .start-box p {
            color: #d1c7bd;
            font-size: 17px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-style: italic;
        }

        .btn-start {
            background-color: #e6c584;
            color: #070d1a;
            border: none;
            padding: 14px 38px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(230, 197, 132, 0.4);
            transition: 0.3s;
        }

        .btn-start:hover {
            background-color: #f7e2b3;
            transform: scale(1.05);
        }

        /* Contenitori dei messaggi a tempo */
        .story-step {
            position: absolute;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            text-align: center;
            color: #ffffff;
            width: 85%;
            max-width: 450px;
            padding: 25px;
            pointer-events: none;
            z-index: 5;
        }

        #step-1 {
            font-family: 'Great Vibes', cursive;
            font-size: 38px;
            color: #f7e2b3;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        #step-2 {
            font-size: 26px;
            color: #fdfbf7;
            line-height: 1.6;
            font-style: italic;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }
