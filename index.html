<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promessa di Matrimonio - Giovanni & Eliana</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Playfair Display', 'Georgia', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video come sfondo a tutto schermo */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.65); /* Scurisce leggermente per far risaltare il testo */
        }

        /* Riquadro centrale dell'invito con effetto vetro sfocato */
        .invitation-card {
            background: rgba(20, 20, 20, 0.68);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px 25px;
            border-radius: 20px;
            width: 88%;
            max-width: 400px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #dfc187;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 5px 0;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .names {
            font-size: 22px;
            color: #f3e5ab;
            margin-bottom: 20px;
            font-style: italic;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: #dfc187;
            margin: 15px auto;
        }

        .details {
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
            margin: 15px 0;
        }

        .details strong {
            color: #fff;
        }

        .footer-note {
            font-size: 12px;
            color: #ccc;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Sfondo video in loop con il nome corretto -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="gemini_generated_video_8d12205a.mp4" type="video/mp4">
        Il tuo browser non supporta i video HTML5.
    </video>

    <!-- Audio di sottofondo in loop -->
    <audio id="bg-music" autoplay loop>
        <source src="canzone.mp3.mp3" type="audio/mp3">
    </audio>

    <!-- Card principale dell'invito -->
    <div class="invitation-card">
        <div class="tag">La Nostra Promessa</div>
        <h1>Giovanni & Eliana</h1>
        <div class="names">&mdash; 23 Gennaio &mdash;</div>
        
        <div class="divider"></div>

        <div class="details">
            <p>📍 <strong>Cerimonia:</strong><br>Comune di Napoli</p>
            <p>🕒 <strong>Programma:</strong><br>Arrivo degli ospiti e celebrazione, a seguire brindisi insieme.</p>
        </div>

        <div class="divider"></div>

        <div class="footer-note">
            La vostra presenza è il regalo più bello.
        </div>
    </div>

    <script>
        // Sblocca eventuale audio bloccato al primo tocco
        document.addEventListener('click', function() {
            var music = document.getElementById('bg-music');
            if (music.paused) {
                music.play();
            }
        }, { once: true });
    </script>

</body>
</html>
