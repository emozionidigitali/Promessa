<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promessa di Matrimonio - Giovanni & Eliana</title>
    <!-- Importazione dei font eleganti -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            /* Sfondo blu notte profondo con animazione fluida garantita su mobile */
            background: linear-gradient(135deg, #070d1a, #101c30, #0a101f);
            background-size: 200% 200%;
            animation: bgMove 12s ease infinite;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Schermata iniziale per sbloccare l'audio e l'interazione */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 13, 26, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }

        .start-box h2 {
            font-family: 'Great Vibes', cursive;
            color: #e6c584;
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .start-box p {
            color: #d1c7bd;
            font-size: 18px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn-start {
            background-color: #e6c584;
            color: #070d1a;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(230, 197, 132, 0.4);
            transition: 0.3s;
        }

        .btn-start:hover {
            background-color: #f7e2b3;
            transform: scale(1.05);
        }

        /* Contenitori dei messaggi a tempo */
        .story-step {
            position: absolute;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in-out, visibility 1.5s ease-in-out;
            text-align: center;
            color: #ffffff;
            width: 85%;
            max-width: 450px;
            padding: 25px;
            z-index: 10;
        }

        .visible {
            opacity: 1 !important;
            visibility: visible !important;
        }

        #step-1 {
            font-family: 'Great Vibes', cursive;
            font-size: 40px;
            color: #f7e2b3;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        #step-2 {
            font-size: 28px;
            color: #fdfbf7;
            line-height: 1.6;
            font-style: italic;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }

        #step-3 {
            background: rgba(14, 23, 41, 0.95);
            border: 1px solid rgba(230, 197, 132, 0.5);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        .tag {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #e6c584;
            margin-bottom: 12px;
            font-weight: 600;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 50px;
            margin: 0 0 5px 0;
            font-weight: normal;
            color: #f7e2b3;
        }

        .names {
            font-size: 24px;
            color: #d1c7bd;
            margin-bottom: 20px;
            font-style: italic;
        }

        .divider {
            width: 60px;
            height: 1px;
            background-color: #e6c584;
            margin: 18px auto;
        }

        .details {
            font-size: 17px;
            line-height: 1.7;
            color: #e2ded8;
            margin: 15px 0;
            text-align: left;
        }
