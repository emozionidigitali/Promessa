<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promessa di Matrimonio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background-image: url('foto1.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        .overlay {
            background: rgba(255, 255, 255, 0.88);
            padding: 25px;
            border-radius: 15px;
            max-width: 90%;
            width: 420px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            margin: 20px 0;
        }

        h1.title {
            color: #8c7355;
            font-size: 24px;
            margin-bottom: 5px;
        }

        h2.subtitle {
            font-size: 15px;
            color: #555;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .date {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 12px 0;
            padding: 8px;
            background: #f7f4f0;
            border-radius: 8px;
        }

        .section {
            margin: 15px 0;
            text-align: left;
        }

        .section h3 {
            color: #8c7355;
            font-size: 15px;
            border-bottom: 2px solid #e6dfd5;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        .section p {
            font-size: 13px;
            line-height: 1.4;
            color: #444;
            margin: 4px 0;
        }
    </style>
</head>
<body>

    <!-- Audio invisibile in sottofondo -->
    <audio id="bg-music" autoplay loop>
        <source src="canzone.mp3.mp3" type="audio/mp3">
    </audio>

    <!-- Contenuto Principale dell'Invito -->
    <div class="overlay">
        <h1 class="title">La Nostra Promessa</h1>
        <h2 class="subtitle">[I vostri nomi]</h2>
        
        <div class="date">
            📅 [Data] | Ore [Orario]
        </div>

        <div class="section">
            <h3>📍 Dove</h3>
            <p><strong>Cerimonia:</strong> [Nome Location o Comune]<br>
            Indirizzo: [Indirizzo, Città]</p>
        </div>

        <div class="section">
            <h3>🕒 Programma</h3>
            <p>• Arrivo degli ospiti<br>
            • Celebrazione<br>
            • Festeggiamenti insieme</p>
        </div>

        <div class="section">
            <h3>🎁 Informazioni Utili</h3>
            <p>La vostra presenza è il regalo più bello per noi!</p>
        </div>
    </div>

    <script>
        // Sblocca la musica al primo tocco sullo schermo se il browser la blocca inizialmente
        document.addEventListener('click', function() {
            var music = document.getElementById('bg-music');
            if (music.paused) {
                music.play();
            }
        }, { once: true });
    </script>

</body>
</html>
