<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promessa di Matrimonio - Giovanni & Eliana</title>
    <!-- Font eleganti in stile matrimonio (Great Vibes & Cormorant Garamond) -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background: #4A5847; /* Verde salvia scuro elegante */
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Schermata iniziale con pulsante */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #4A5847;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            color: #fff;
            text-align: center;
            padding: 20px;
            transition: opacity 1s ease;
        }

        .start-box h2 {
            font-family: 'Great Vibes', cursive;
            color: #e6c584;
            font-size: 52px;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        .start-box p {
            color: #f1ede1;
            font-size: 18px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .btn-start {
            background-color: #e6c584;
            color: #2F3B2E;
            border: none;
            padding: 15px 45px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(230, 197, 132, 0.4);
            transition: transform 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        /* Contenitore Video Intro */
        #intro-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #232b22;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Effetto Flash Lento per la transizione */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #f7e2b3;
            z-index: 10005;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease-in-out;
        }

        /* --- PRESENTAZIONE FOTO A SCHERMO INTERO CON FRASI EMOZIONANTI --- */
        #photo-slideshow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a2219;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10002;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
        }

        .slide-item {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            padding: 20px;
        }

        .slide-item.active-slide {
            opacity: 1;
            visibility: visible;
        }

        .slide-item img {
            width: 100%;
            max-width: 650px;
            height: 65vh;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e6c584;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            animation: cinematicZoom 5s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .slide-caption {
            font-family: 'Great Vibes', cursive;
            font-size: 34px;
            color: #f7e2b3;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
            margin-top: 20px;
            text-align: center;
            max-width: 90%;
        }

        /* Scritte in sovraimpressione per il video 8 */
        .intro-overlay-text {
            position: absolute;
            z-index: 10000;
            text-align: center;
            color: #ffffff;
            width: 90%;
            max-width: 600px;
            pointer-events: none;
            padding: 0 20px;
        }

        .intro-phrase {
            position: absolute;
            width: 100%;
            left: 0;
            right: 0;
            margin: auto;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #intro-text-1 { font-family: 'Great Vibes', cursive; font-size: 38px; color: #f7e2b3; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }
        #intro-text-2 { font-size: 21px; color: #fdfbf7; font-style: italic; text-shadow: 0 2px 12px rgba(0,0,0,0.9); letter-spacing: 1px; }
        #intro-text-3 { font-family: 'Great Vibes', cursive; font-size: 40px; color: #f7e2b3; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }
        #intro-text-4 { font-size: 21px; color: #fdfbf7; font-style: italic; text-shadow: 0 2px 12px rgba(0,0,0,0.9); letter-spacing: 1px; }
        #intro-text-5 { font-family: 'Great Vibes', cursive; font-size: 42px; color: #f7e2b3; text-shadow: 0 2px 15px rgba(0,0,0,0.9); }

        .show-phrase { opacity: 1 !important; }

        /* Testi della sequenza successiva con transizione per lo zoom finale */
        .story-step {
            position: absolute;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease, visibility 1.5s ease, transform 2s ease, box-shadow 2s ease;
            text-align: center;
            color: #ffffff;
            width: 92%;
            max-width: 520px;
            padding: 18px 16px;
            z-index: 10;
        }

        .visible {
            opacity: 1 !important;
            visibility: visible !important;
        }

        /* Classe per l'effetto ottico combinato finale */
        .grand-finale-effect {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(230, 197, 132, 0.7), inset 0 0 20px rgba(230, 197, 132, 0.3) !important;
            border: 1.5px solid #fff !important;
            background: rgba(58, 70, 56, 0.98) !important;
        }

        #step-1 {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #f7e2b3;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
            line-height: 1.3;
        }

        #step-2 {
            font-size: 24px;
            color: #fdfbf7;
            line-height: 1.6;
            font-style: italic;
            text-shadow: 0 2px 12px rgba(0,0,0,0.9);
        }

        #step-3 {
            background: rgba(52, 63, 50, 0.97);
            border: 1px solid rgba(230, 197, 132, 0.4);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            z-index: 20;
            max-height: 94vh;
            overflow-y: auto;
        }

        .tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #e6c584;
            margin-bottom: 3px;
            font-weight: 600;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 40px;
            margin: 0 0 2px 0;
            font-weight: normal;
            color: #f7e2b3;
        }

        .names {
            font-size: 15px;
            color: #e1dad0;
            margin-bottom: 6px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: #e6c584;
            margin: 6px auto;
        }

        /* Sezione Dettagli */
        .details {
            font-size: 14px;
            line-height: 1.4;
            color: #f2efe9;
            margin: 4px 0;
            text-align: left;
        }

        .detail-row {
            margin-bottom: 4px;
        }

        .detail-row strong {
            color: #e6c584;
            font-size: 15px;
        }

        /* Pulsanti d'azione (Mappa & Calendario) */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-action {
            display: inline-block;
            background-color: transparent;
            color: #e6c584;
            border: 1px solid #e6c584;
            padding: 4px 12px;
            font-size: 11px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            border-radius: 20px;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }

        .btn-action:hover {
            background-color: #e6c584;
            color: #2F3B2E;
        }

        /* Conto alla rovescia */
        .countdown-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e6c584;
            margin-top: 6px;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 4px 0 8px 0;
        }

        .countdown-box {
            background: linear-gradient(135deg, #3d4c3a 0%, #293427 100%);
            border: 1.5px solid #e6c584;
            border-radius: 6px;
            padding: 4px 6px;
            text-align: center;
            min-width: 48px;
            box-shadow: 0 0 10px rgba(230, 197, 132, 0.2);
        }

        .countdown-number {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 6px rgba(247, 226, 179, 0.6);
            display: block;
        }

        .countdown-label {
            font-size: 8px;
            text-transform: uppercase;
            color: #e6c584;
            letter-spacing: 1px;
            margin-top: 1px;
            display: block;
        }

        /* Video 3 all'interno della card */
        .video-container {
            margin-top: 4px;
        }

        .video-container video {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(230, 197, 132, 0.4);
            background: #000;
        }

        /* Sezione RSVP Pulsanti WhatsApp */
        .rsvp-section {
            margin-top: 6px;
            text-align: center;
        }

        .rsvp-title {
            font-size: 12px;
            color: #e6c584;
            margin-bottom: 3px;
            font-style: italic;
        }

        .rsvp-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-rsvp {
            display: inline-block;
            padding: 4px 12px;
            font-size: 11px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            border-radius: 20px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .btn-yes {
            background-color: #25d366;
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .btn-no {
            background-color: transparent;
            color: #e1dad0;
            border: 1px solid #e1dad0;
        }

        .btn-rsvp:hover {
            transform: scale(1.05);
        }

        /* Frase Emozionante Finale Pulsante */
        .final-quote {
            font-family: 'Great Vibes', cursive;
            font-size: 21px;
            color: #f7e2b3;
            margin-top: 6px;
            margin-bottom: 2px;
            text-align: center;
            transition: transform 0.5s ease, text-shadow 0.5s ease;
        }

        .pulse-quote {
            animation: pulseGlow 1.8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); text-shadow: 0 0 5px rgba(247, 226, 179, 0.4); }
            100% { transform: scale(1.06); text-shadow: 0 0 18px rgba(247, 226, 179, 0.9), 0 0 25px rgba(230, 197, 132, 0.6); }
        }

        .footer-note {
            font-size: 11px;
            color: #e1dad0;
            margin-top: 2px;
            font-style: italic;
        }

        /* Fuochi d'artificio */
        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
