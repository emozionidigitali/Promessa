<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promessa di Matrimonio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            /* Imposta la foto come sfondo a tutto schermo */
            background-image: url('foto1.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay {
            background: rgba(255, 255, 255, 0.85); /* Sfondo semi-trasparente per leggere il testo */
            padding: 30px;
            border-radius: 15px;
            max-width: 90%;
            width: 450px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        h1 {
            color: #8c7355;
            font-size: 26px;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 16px;
            color: #555;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .date {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 15px 0;
            padding: 10px;
            background: #f7f4f0;
            border-radius: 8px;
        }
        .section {
            margin: 20px 0;
            text-align: left;
        }
        .section h3 {
            color: #8c7355;
            font-size: 16px;
            border-bottom: 2px solid #e6dfd5;
            padding-bottom: 4px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #444;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <h1>La Nostra Promessa</h1>
        <h2>[I vostri nomi]</h2>
        
        <div class="date">
            📅 [Data] | Ore [Orario]
        </div>

        <div class="section">
            <h3>📍 Dove</h3>
            <p><strong>Cerimonia:</strong> [Nome Location o Comune]<br>
            Indirizzo: [Indirizzo, Città]</p>
        </div>

        <div class="section">
            <h3>🕒 Programma</h3>
            <p>• Arrivo degli ospiti<br>
            • Celebrazione<br>
            • Festeggiamenti insieme</p>
        </div>

        <div class="section">
            <h3>🎁 Informazioni Utili</h3>
            <p>La vostra presenza è il regalo più bello per noi!</p>
        </div>
    </div>

</body>
</html>
